<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- mobile scaling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/mixed.css">

  
<div id="toast"></div>

  <script src="assets/checkout.js" defer></script>
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="assets/logo1.jpg" class="brand-logo" alt="Green Zone" style="height:40px; width:auto;">
        <div class="d-flex flex-column">
          <span class="fw-bold">Green Zone</span>
          <small class="text-muted">Your neighbourhood medical shop</small>
        </div>
      </a>
    </div>
  </nav>

  <!-- Checkout Section -->
  <div class="container py-3">

    <!-- Cart Summary -->
    <div class="card shadow-sm mb-3">
      <div class="card-body">
        <h5 class="card-title mb-3">🛒 Your Order</h5>
        <ul id="orderSummary" class="list-group list-group-flush small"></ul>
        <div class="d-flex justify-content-between align-items-center mt-3">
          <strong>Total:</strong>
          <span class="fs-5 fw-bold text-success">₹<span id="orderTotal">0</span></span>
        </div>
      </div>
    </div>

    <!-- Checkout Form -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-3">📦 Shipping Details</h5>
        <form id="checkoutForm">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" id="name" class="form-control form-control-sm" placeholder="Enter your name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Mobile</label>
            <input type="tel" id="mobile" class="form-control form-control-sm" placeholder="10-digit mobile" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea id="address" class="form-control form-control-sm" rows="3" placeholder="House no, Street, City" required></textarea>
          </div>
          <button type="submit" class="btn btn-success w-100 py-2">✅ Place Order</button>
        </form>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
