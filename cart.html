<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/mixed.css">
  <script src="assets/cart.js" defer></script>
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="assets/logo1.jpg" class="brand-logo" alt="Green Zone" style="height:40px;">
        <div class="d-flex flex-column">
          <span class="fw-bold">Green Zone</span>
          <small class="text-muted">Your neighbourhood medical shop</small>
        </div>
      </a>
            <a href="index.html" class="btn btn-outline-success">Shop More </a>

    </div>
  </nav>

  <!-- Cart Section -->
  <div class="container py-3">
    <h4 class="mb-3">🛒 Your Cart</h4>
    <div id="cart" class="card shadow-sm p-2"></div>
    <div class="d-flex justify-content-between align-items-center mt-3">
      <strong>Total:</strong>
      <span class="fs-5 fw-bold text-success" id="total">₹0</span>
    </div>
    <a href="checkout.html" class="btn btn-success w-100 mt-3">Proceed to Checkout</a>
  </div>

</body>
</html>
