<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Owner Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">

  <script src="assets/login.js" defer></script>
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="assets/logo1.jpg" class="brand-logo" alt="Green Zone">
        <div>
          <div style="font-weight:800;">Green Zone</div>
          <small class="text-muted">Your neighbourhood medical shop</small>
        </div>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav ms-auto me-3">
          <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="">Contact Us</a></li>
        </ul>

        <form class="d-flex position-relative me-3" id="searchForm">
          <input id="searchInput" class="form-control me-2" type="search" placeholder="Search for medicines, health care..." aria-label="Search">
          <button class="btn btn-success" type="submit">Search</button>
          <div id="searchSuggestions" class="search-suggestion d-none"></div>
        </form>

        <a href="cart.html" class="btn btn-outline-success">Cart <span id="cartCount" class="badge bg-danger ms-2">0</span></a>
      </div>
    </div>
  </nav>


  <div class="container mt-5">
    <div class="card shadow-sm p-4 col-md-4 mx-auto">
      <h3 class="mb-3 text-center">Owner Login</h3>
      <form id="loginForm">
        <input type="text" id="username" class="form-control mb-3" placeholder="Username" required>
        <input type="password" id="password" class="form-control mb-3" placeholder="Password" required>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
    </div>
  </div>
</body>
</html>
